<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定位模擬器</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d12; --panel:#0d1118; --surface:#141925; --surface-hi:#1a2030; --border:#1b212d;
    --text:#e9eef5; --muted:#8a96a8; --faint:#566273;
    --signal:#2dd4bf; --soft:#2dd4bf1a; --go:#4ade80; --warn:#fbbf24; --stop:#f87171; --select:#60a5fa;
    --mono:'JetBrains Mono',ui-monospace,monospace; --ui:'Archivo',system-ui,"Noto Sans TC",sans-serif;
    --r:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:var(--ui);background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;font-size:14px;-webkit-font-smoothing:antialiased}
  svg.ic{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}

  #panel{width:312px;flex-shrink:0;background:var(--panel);display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin}
  #panel::-webkit-scrollbar{width:7px}#panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

  /* 標題：小寫、輕量、無分隔線 */
  .head{padding:20px 18px 6px}
  .head h1{font-size:14px;font-weight:600;letter-spacing:.01em;display:flex;align-items:center;gap:9px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);transition:all .3s}
  .dot.running{background:var(--signal);box-shadow:0 0 10px 1px var(--signal);animation:blink 1.5s infinite}
  .dot.paused{background:var(--warn);box-shadow:0 0 8px 1px var(--warn)}
  .dot.finished{background:var(--signal);box-shadow:0 0 8px 1px var(--signal)}
  @keyframes blink{50%{opacity:.4}}
  .head .sub{font-size:11.5px;color:var(--faint);margin-top:7px;line-height:1.4}
  .head-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .head-actions{display:flex;gap:2px}
  .head-actions button{background:none;border:none;color:var(--faint);cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center}
  .head-actions button:hover{background:var(--surface);color:var(--text)}

  /* 區塊以留白分組,不用分隔線 */
  .section{padding:14px 18px}
  .label{font-size:11px;font-weight:500;color:var(--faint);margin-bottom:11px;letter-spacing:.01em}

  /* 分段式模式選擇 */
  .modes{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;background:var(--surface);border-radius:11px;padding:4px;gap:2px}
  .mode-btn{font-family:var(--ui);font-size:12px;font-weight:500;padding:8px 2px;background:none;border:none;border-radius:8px;color:var(--muted);cursor:pointer;transition:.15s}
  .mode-btn:hover{color:var(--text)}
  .mode-btn.active{background:var(--soft);color:var(--signal);font-weight:600}

  .row{display:flex;align-items:center;gap:10px}
  select{flex:1;font-family:var(--ui);font-size:13px;padding:9px 11px;background:var(--surface);border:1px solid var(--border);border-radius:9px;color:var(--text)}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:var(--border)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--signal);cursor:pointer;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--signal)}
  input[type=range]:disabled{cursor:not-allowed;opacity:.6}
  .readout{font-family:var(--mono);font-size:13px;color:var(--signal);min-width:62px;text-align:right}

  /* 開關：整列(文字左 / switch 右) */
  .toggle-row{display:flex;flex-direction:column;gap:14px;margin-top:16px}
  .toggle{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:13px;color:var(--text);cursor:pointer;user-select:none}
  .track{width:38px;height:22px;border-radius:99px;background:var(--border);position:relative;transition:.18s;flex-shrink:0}
  .track::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.18s}
  .toggle input{display:none}
  .toggle input:checked+.track{background:var(--signal)}
  .toggle input:checked+.track::after{transform:translateX(16px)}

  /* 進階揭露 */
  .disc{margin-top:16px}
  .disc>summary{list-style:none;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
  .disc>summary::-webkit-details-marker{display:none}
  .disc>summary .chev{transition:.2s;width:14px;height:14px}
  .disc[open]>summary .chev{transform:rotate(90deg)}
  .adv-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
  .adv{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--faint);background:var(--surface);border-radius:10px;padding:10px 11px}
  .adv-wide{grid-column:1 / -1}
  .adv input[type=number]{font-family:var(--mono);font-size:14px;padding:6px 8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text)}
  .adv input[type=range]{width:100%}
  .adv .readout{font-family:var(--mono);min-width:auto}

  #wp-list{display:flex;flex-direction:column;gap:6px;max-height:140px;overflow-y:auto}
  .wp{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;background:var(--surface);border-radius:10px;padding:8px 11px;color:var(--muted)}
  .wp .idx{width:18px;height:18px;border-radius:50%;background:var(--soft);color:var(--signal);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
  .wp .coord{flex:1;color:var(--text)}
  .empty-hint{font-size:12px;color:var(--faint);line-height:1.6}

  .transport{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:var(--ui);font-size:13px;font-weight:500;padding:10px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--surface-hi)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.go{background:var(--signal);border-color:transparent;color:#04231f;font-weight:600}
  .btn.go:hover:not(:disabled){filter:brightness(1.07);background:var(--signal)}
  .btn.warn{color:var(--warn)}.btn.stop{color:var(--stop)}
  .btn.wide{width:100%}
  .btn.connected{background:var(--soft);border-color:var(--signal);color:var(--signal)}

  #dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:168px;margin:0 auto}
  .dbtn{aspect-ratio:1;background:var(--surface);border-radius:10px;color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none}
  .dbtn.held{background:var(--soft);color:var(--signal)}
  .dbtn.blank{background:transparent;cursor:default}

  /* 遙測:地圖上毛玻璃卡 */
  #tele-card{position:absolute;left:16px;bottom:16px;z-index:600;width:236px;padding:15px 16px;border-radius:16px;border:1px solid var(--border);background:#0d1118cc;backdrop-filter:blur(14px);box-shadow:0 10px 34px #000a;transition:opacity .3s}
  #tele-card.idle{opacity:.55}
  .telemetry{display:flex;flex-direction:column}
  .tele-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:12px}
  .tele-row{display:flex;justify-content:space-between;align-items:center;margin:7px 0}
  .tele-row .k{font-size:12px;color:var(--faint)}
  .tele-row .v{font-family:var(--mono);font-size:12.5px;color:var(--text)}
  .tele-row .v-wrap{display:inline-flex;align-items:center;gap:6px}
  .progress-track{height:3px;border-radius:2px;background:var(--border);overflow:hidden;margin-top:6px}
  .progress-fill{height:100%;width:0;background:var(--signal);transition:width .2s linear}
  .copy-mini{background:none;border:none;color:var(--faint);cursor:pointer;padding:2px;border-radius:6px;display:grid;place-items:center}
  .copy-mini:hover{color:var(--text)}

  #map{flex:1;background:#0a0d12;position:relative}
  .leaflet-container{background:#0a0d12;font-family:var(--ui)}
  .pos-marker{width:16px;height:16px;border-radius:50%;background:var(--signal);border:2px solid #0a0d12;animation:ping 1.7s ease-out infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}70%{box-shadow:0 0 0 15px rgba(45,212,191,0)}100%{box-shadow:0 0 0 0 rgba(45,212,191,0)}}
  .wp-marker{width:22px;height:22px;border-radius:50% 50% 50% 0;background:var(--signal);transform:rotate(-45deg);border:2px solid #0a0d12;display:flex;align-items:center;justify-content:center}
  .wp-marker span{transform:rotate(45deg);color:#04231f;font-weight:700;font-size:11px;font-family:var(--mono)}
  .re-marker{width:22px;height:22px;border-radius:50% 50% 50% 0;background:#f59e0b;transform:rotate(-45deg);border:2px solid #0a0d12;display:flex;align-items:center;justify-content:center}
  .re-marker span{transform:rotate(45deg);color:#0a0d12;font-weight:700;font-size:11px;font-family:var(--mono)}
  .map-hint{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:500;background:#0d1118e6;border:1px solid var(--border);padding:8px 16px;border-radius:99px;font-size:12px;color:var(--muted);pointer-events:none;transition:opacity .3s;opacity:0}

  /* 地圖搜尋(毛玻璃) */
  #map-search{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:1000;width:min(440px,56%)}
  #map-search-input{width:100%;padding:11px 15px;border-radius:12px;border:1px solid var(--border);background:#0d1118d9;color:var(--text);font-family:var(--ui);font-size:13px;backdrop-filter:blur(10px);box-shadow:0 6px 24px #0009}
  #map-search-input::placeholder{color:var(--faint)}
  #map-search-input:focus{outline:none;border-color:var(--signal)}
  #map-search-results{margin-top:6px;background:#0d1118f2;border:1px solid var(--border);border-radius:12px;overflow:hidden;display:none;backdrop-filter:blur(10px);box-shadow:0 8px 28px #000b;max-height:320px;overflow-y:auto}
  .msr{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer}
  .msr+.msr{border-top:1px solid var(--border)}
  .msr:hover,.msr.sel{background:var(--surface-hi)}
  .msr .mi{flex:1;min-width:0}
  .msr .mn{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msr .mc{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px}
  .msr .mcopy{background:none;border:none;color:var(--faint);border-radius:7px;padding:5px;cursor:pointer;flex:none;display:grid;place-items:center}
  .msr .mcopy:hover{color:var(--text);background:var(--bg)}

  /* 右側面板 */
  #spots-panel{width:312px;flex-shrink:0;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
  #spots-resizer{width:5px;flex-shrink:0;cursor:col-resize;background:transparent;transition:background .15s}
  #spots-resizer:hover,#spots-resizer.dragging{background:var(--signal);opacity:.5}
  .spots-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0}
  #btn-spots-collapse,#spots-expand{background:none;border:none;color:var(--faint);cursor:pointer;border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  #btn-spots-collapse:hover,#spots-expand:hover{background:var(--surface);color:var(--text)}
  #spots-expand{position:fixed;top:16px;right:16px;z-index:700;display:none;background:var(--surface);border:1px solid var(--border);box-shadow:0 2px 8px #0006}
  body.spots-collapsed #spots-panel,body.spots-collapsed #spots-resizer{display:none}
  body.spots-collapsed #spots-expand{display:flex}
  #spots-panel::-webkit-scrollbar{width:7px}#spots-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  .panel-tabs{display:flex;gap:18px}
  .ptab{font-family:var(--ui);font-size:14px;font-weight:600;padding:0 0 10px;background:none;border:none;border-bottom:2px solid transparent;color:var(--faint);cursor:pointer}
  .ptab:hover{color:var(--text)}
  .ptab.active{color:var(--text);border-bottom-color:var(--signal)}
  #tab-spots,#tab-routes{display:flex;flex-direction:column;flex:1;min-height:0}

  .sf-types{display:flex;gap:7px}
  .chip{flex:1;font-family:var(--ui);font-size:12.5px;padding:7px 6px;background:none;border:1px solid var(--border);border-radius:99px;color:var(--muted);cursor:pointer;transition:.15s}
  .chip:hover{color:var(--text)}
  .chip.active{background:var(--soft);border-color:transparent;color:var(--signal);font-weight:500}

  #spot-list{display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;overflow-y:auto}
  #spot-list::-webkit-scrollbar{width:6px}#spot-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .spot{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--surface);border-radius:12px;transition:.15s;cursor:pointer;border:1px solid transparent}
  .spot:hover{background:var(--surface-hi)}
  .spot.active{background:var(--soft);border-color:var(--signal)}
  .spot.active .sname{color:var(--signal)}
  .spot .sicon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
  .spot .sbody{flex:1;min-width:0}
  .spot .sname{font-size:13.5px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spot .smeta{font-size:11px;color:var(--faint);margin-top:1px}
  .spot .scoord{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
  .spot .sact{display:flex;gap:1px;opacity:0;transition:.15s}
  .spot:hover .sact{opacity:1}
  .spot .sact button{background:none;border:none;color:var(--faint);cursor:pointer;padding:6px;border-radius:7px;display:grid;place-items:center}
  .spot .sact button:hover{background:var(--surface);color:var(--text)}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .form-grid, .form-grid *{min-width:0}
  .form-grid input,.form-grid select{width:100%}
  .form-grid input[type=text],.form-grid input:not([type]){font-family:var(--ui);font-size:13px;padding:9px 11px;background:var(--surface);border:1px solid var(--border);border-radius:9px;color:var(--text)}
  .spi{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--signal);vertical-align:middle}

  #route-list{display:flex;flex-direction:column;gap:7px}
  .route{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--surface);border-radius:12px;transition:.15s}
  .route:hover{background:var(--surface-hi)}
  .route .rbody{flex:1;min-width:0}
  .route .rname{font-size:13.5px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .route .rmeta{font-size:11px;color:var(--faint);margin-top:1px}
  .route .ract{display:flex;gap:1px;opacity:0;transition:.15s}
  .route:hover .ract{opacity:1}
  .route .ract button{background:none;border:none;color:var(--faint);cursor:pointer;padding:6px;border-radius:7px;display:grid;place-items:center}
  .route .ract button:hover{background:var(--surface);color:var(--text)}
  #route-points{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto}
  #route-points::-webkit-scrollbar{width:6px}#route-points::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .rpt{display:flex;align-items:center;gap:5px}
  .rpt .ri{font-size:11px;color:var(--faint);width:16px;flex-shrink:0;text-align:center}
  .rpt input{min-width:0;flex:1;font-family:var(--mono);font-size:11.5px;padding:6px 8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text)}
  .rpt button{background:none;border:none;color:var(--faint);cursor:pointer;padding:5px;border-radius:6px;flex-shrink:0;display:grid;place-items:center}
  .rpt button:hover{background:var(--surface);color:var(--text)}
  .route-loop-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer}
  .route-loop-row input[type=checkbox]{width:16px;height:16px;flex:none;margin:0;accent-color:var(--signal);cursor:pointer}

  /* 通道狀態 */
  .tunnel-row{display:flex;align-items:center;gap:8px;margin-top:10px}
  .tunnel-pill{flex:1;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:var(--surface);border-radius:9px;padding:8px 11px}
  .tunnel-pill .tdot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
  .tunnel-pill.up .tdot{background:var(--signal)}
  .tunnel-pill.down .tdot{background:var(--stop)}
  .tunnel-row .btn{padding:8px 12px;font-size:12px}

  /* 彈窗 */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(2px)}
  .modal{width:360px;max-width:92vw;max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:0 24px 64px rgba(0,0,0,.55)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;font-size:15px;font-weight:600;color:var(--text)}
  .modal-head button{background:none;border:none;color:var(--faint);cursor:pointer;padding:4px;border-radius:7px;display:grid;place-items:center}
  .modal-head button:hover{color:var(--text);background:var(--surface)}
  .modal-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}
  .fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
  .fld input,.fld select{font-family:var(--ui);font-size:13px;padding:9px 11px;background:var(--surface);border:1px solid var(--border);border-radius:9px;color:var(--text)}
  .chkline{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);cursor:pointer}
  .chkline input{width:16px;height:16px;accent-color:var(--signal);flex:none;margin:0}
  .modal-section{font-size:11px;color:var(--faint);padding-top:6px}
  .lic-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-size:12.5px}
  .lic-grid .lk{color:var(--faint)}
  .lic-grid .lv{color:var(--text)}
  .lic-grid .lic-mid{display:flex;align-items:center;gap:6px;min-width:0}
  .lic-grid .lic-mid code{font-family:var(--mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #lic-status.ok{color:var(--signal)}#lic-status.bad{color:var(--stop)}

  /* 日誌面板 */
  .log-panel{position:fixed;left:0;bottom:0;width:min(560px,46vw);height:min(300px,42vh);background:var(--panel);border:1px solid var(--border);border-radius:0 14px 0 0;box-shadow:0 -12px 44px rgba(0,0,0,.45);z-index:1500;display:flex;flex-direction:column}
  .log-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;font-size:13px;font-weight:600;color:var(--text)}
  .log-actions{display:flex;gap:4px}
  .log-actions button{background:none;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:11px;padding:5px 10px;border-radius:7px}
  .log-actions button:hover{background:var(--surface);color:var(--text)}
  .log-body{flex:1;overflow:auto;padding:8px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.55;color:var(--muted);white-space:pre-wrap;word-break:break-word}
  .log-body .lt{color:var(--faint)}
  .log-body::-webkit-scrollbar{width:7px}.log-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

  /* 移動中鎖定變灰 */
  .toggle:has(input:disabled){opacity:.4;pointer-events:none}
  .adv:has(input:disabled){opacity:.4}
  .adv input:disabled{cursor:not-allowed}
  body.sim-active #modes{opacity:.45;pointer-events:none}
  body.sim-active #spots-panel [data-act="load"]{opacity:.35;pointer-events:none}

  /* 可用裝置清單 */
  .dev-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .dev-head .btn{padding:6px 10px;font-size:12px}
  #dev-list{display:flex;flex-direction:column;gap:6px}
  .dev{display:flex;align-items:center;gap:10px;padding:10px 11px;background:var(--surface);border:1px solid transparent;border-radius:11px;cursor:pointer;transition:.15s}
  .dev:hover{background:var(--surface-hi)}
  .dev.active{border-color:var(--signal)}
  .dev-info{flex:1;min-width:0}
  .dev-name{font-size:13px;color:var(--text);display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dev-sub{font-size:11px;color:var(--muted);margin-top:2px}
  .dev-badge{font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid var(--border);flex:none}
  .dev-badge.usb{color:#93c5fd}
  .dev-badge.wifi{color:#5eead4}
  .dev-sel{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);flex:none}
  .dev.active .dev-sel{border-color:var(--signal);background:var(--signal)}
  .dev-empty{font-size:12px;color:var(--faint);padding:6px 2px;line-height:1.5}
  .dev.connecting{border-color:var(--signal)}
  .dev.connecting .dev-name,.dev.connecting .dev-sub{color:var(--signal)}
  #dev-list.busy{pointer-events:none}
  #dev-list.busy .dev:not(.connecting){opacity:.45}
  .spinner{width:15px;height:15px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--signal);animation:spin .7s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 已連線工作階段清單 */
  #session-list{display:flex;flex-direction:column;gap:8px}
  .sess{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--surface);border:1px solid transparent;border-radius:12px;cursor:pointer;transition:.15s}
  .sess:hover{background:var(--surface-hi)}
  .sess.active{border-color:var(--signal)}
  .sess .swatch{width:9px;height:9px;border-radius:50%;flex:none}
  .sess .info{flex:1;min-width:0}
  .sess .nm{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sess .st{font-size:11.5px;color:var(--muted);margin-top:3px}
  .sess .mini{height:2px;border-radius:2px;background:var(--border);margin-top:7px;overflow:hidden}
  .sess .mini>div{height:100%;width:0}
  .sess .x{background:none;border:none;color:var(--faint);cursor:pointer;padding:5px;border-radius:7px;flex:none;opacity:0;transition:.15s;display:grid;place-items:center}
  .sess:hover .x{opacity:1}
  .sess .x:hover{background:var(--bg);color:var(--stop)}
  .group-row{display:flex;gap:8px;margin-top:10px}
  .group-row .btn{flex:1;padding:10px;font-size:12.5px}
  .btn.stop{color:var(--stop)}
  .ctl-head{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .ctl-head b{color:var(--text);font-weight:600}
  #control-section.disabled{opacity:.4;pointer-events:none}

  .addbtn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px;border:1px dashed var(--border);border-radius:12px;color:var(--muted);font-size:13px;cursor:pointer;background:none;transition:.15s}
  .addbtn:hover{border-color:var(--signal);color:var(--text)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="i-target"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></g>
  <g id="i-copy"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></g>
  <g id="i-edit"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></g>
  <g id="i-trash"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></g>
  <g id="i-plus"><path d="M12 5v14M5 12h14"/></g>
  <g id="i-play"><path d="M6 4l14 8-14 8Z" fill="currentColor" stroke="none"/></g>
  <g id="i-pause"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/></g>
  <g id="i-stop"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></g>
  <g id="i-x"><path d="M6 6l12 12M18 6 6 18"/></g>
  <g id="i-chev"><path d="m9 6 6 6-6 6"/></g>
  <g id="i-chev-l"><path d="m15 6-6 6 6 6"/></g>
  <g id="i-settings"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 2.6 15H2.5a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4 8.6a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9 4.6a1.6 1.6 0 0 0 1-1.4V2.5a2 2 0 1 1 4 0v.1A1.6 1.6 0 0 0 17 4.6a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v0a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></g>
  <g id="i-list"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></g>
  <g id="i-search"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></g>
  <g id="i-pin"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></g>
</defs></svg>
<aside id="panel">
  <div class="head">
    <div class="head-top">
      <h1><span class="dot" id="status-dot"></span> 定位模擬器</h1>
      <div class="head-actions">
        <button id="btn-log" title="日誌"><svg class="ic"><use href="#i-list"/></svg></button>
        <button id="btn-settings" title="設定"><svg class="ic"><use href="#i-settings"/></svg></button>
      </div>
    </div>
    <div class="sub" id="status-text">待命中 · 點擊地圖新增航點</div>
  </div>

  <div class="section">
    <div class="label">裝置 <span id="sess-count" style="color:var(--faint)"></span></div>
    <div id="session-list"></div>
    <button class="addbtn" id="btn-add-device" style="margin-top:8px"><svg class="ic"><use href="#i-plus"/></svg> 連接裝置</button>
    <div class="group-row" id="group-row" style="display:none">
      <button class="btn go" id="btn-all-start"><svg class="ic"><use href="#i-play"/></svg> 全部開始</button>
      <button class="btn stop" id="btn-all-stop"><svg class="ic"><use href="#i-stop"/></svg> 全部停止</button>
    </div>
    <button class="btn" id="btn-apply-all" style="display:none;margin-top:8px;width:100%;font-size:12px">套用目前路線到全部</button>
    <div class="tunnel-row" id="tunnel-row" style="display:none">
      <span class="tunnel-pill" id="tunnel-pill"><span class="tdot"></span>通道：檢查中…</span>
      <button class="btn" id="btn-tunnel-restart">重啟</button>
    </div>
  </div>

  <div class="section" id="control-section">
    <div class="ctl-head" id="ctl-head">控制：<b id="ctl-name">—</b></div>
    <div class="label">移動模式</div>
    <div class="modes" id="modes">
      <button class="mode-btn active" data-mode="teleport">單點傳送</button>
      <button class="mode-btn" data-mode="two-point">兩點移動</button>
      <button class="mode-btn" data-mode="multi-point">多點路線</button>
      <button class="mode-btn" data-mode="joystick">搖桿模式</button>
    </div>
  </div>

  <div class="section">
    <div class="label">移動速度</div>
    <div class="row">
      <input type="range" id="speed" min="1" max="500" value="60" aria-label="速度">
      <span class="readout" id="speed-val">60 km/h</span>
    </div>
    <div class="toggle-row">
      <label class="toggle">循環<input type="checkbox" id="loop"><span class="track"></span></label>
      <label class="toggle">GPS 抖動<input type="checkbox" id="jitter" checked><span class="track"></span></label>
      <label class="toggle">反向<input type="checkbox" id="reverse"><span class="track"></span></label>
      <label class="toggle">跟隨鏡頭<input type="checkbox" id="follow" checked><span class="track"></span></label>
    </div>
    <details class="disc">
      <summary><svg class="ic chev"><use href="#i-chev"/></svg> 進階</summary>
      <div class="adv-grid">
        <label class="adv">重複趟數<input type="number" id="repeat" min="1" max="999" value="1"></label>
        <label class="adv">每點停留(秒)<input type="number" id="dwell" min="0" max="600" value="0"></label>
        <label class="adv adv-wide">速度變化 <span class="readout" id="vary-val">0%</span>
          <input type="range" id="vary" min="0" max="80" step="5" value="0"></label>
      </div>
    </details>
  </div>

  <div class="section" id="dpad-section" style="display:none">
    <div class="label">方向控制（或方向鍵）</div>
    <div id="dpad">
      <div class="dbtn blank"></div><div class="dbtn" data-dir="0">↑</div><div class="dbtn blank"></div>
      <div class="dbtn" data-dir="270">←</div><div class="dbtn blank"></div><div class="dbtn" data-dir="90">→</div>
      <div class="dbtn blank"></div><div class="dbtn" data-dir="180">↓</div><div class="dbtn blank"></div>
    </div>
  </div>

  <div class="section">
    <div class="label">航點 <span id="wp-count" style="color:var(--faint)"></span></div>
    <div id="wp-list"></div>
  </div>

  <div class="section">
    <div class="transport">
      <button class="btn go" id="btn-start"><svg class="ic"><use href="#i-play"/></svg> <span id="btn-start-label">開始</span></button>
      <button class="btn warn" id="btn-pause" disabled aria-label="暫停"><svg class="ic"><use href="#i-pause"/></svg></button>
      <button class="btn stop" id="btn-clear" aria-label="清除"><svg class="ic"><use href="#i-stop"/></svg></button>
    </div>
  </div>
</aside>

<div id="map">
  <div id="map-search">
    <input id="map-search-input" type="text" autocomplete="off" placeholder="搜尋地點名稱，或輸入座標（如 25.033, 121.565）">
    <div id="map-search-results"></div>
  </div>
  <div id="tele-card" class="idle">
    <div class="telemetry">
      <div class="tele-head"><span class="dot" id="tele-dot"></span><span id="tele-title">遙測</span></div>
      <div class="tele-row"><span class="k">狀態</span><span class="v" id="t-state">idle</span></div>
      <div class="tele-row"><span class="k">目前座標</span><span class="v-wrap"><span class="v" id="t-pos">—</span><button class="copy-mini" id="btn-copy-pos" title="複製座標"><svg class="ic" style="width:13px;height:13px"><use href="#i-copy"/></svg></button></span></div>
      <div class="tele-row"><span class="k">已移動</span><span class="v" id="t-dist">0 m</span></div>
      <div class="tele-row"><span class="k">預估剩餘</span><span class="v" id="t-eta">—</span></div>
      <div class="tele-row"><span class="k">進度</span><span class="v" id="t-prog">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="t-bar"></div></div>
    </div>
  </div>
  <div class="map-hint" id="map-hint"></div>
</div>

<div id="spots-resizer" title="拖曳調整寬度"></div>

<aside id="spots-panel">
  <div class="head">
    <div class="spots-title-row">
      <div class="panel-tabs" id="panel-tabs">
        <button class="ptab active" data-tab="spots">地點</button>
        <button class="ptab" data-tab="routes">路線</button>
      </div>
      <button id="btn-spots-collapse" title="收摺面板" aria-label="收摺面板"><svg class="ic"><use href="#i-chev"/></svg></button>
    </div>
  </div>

  <div id="tab-spots">
  <div class="section">
    <button class="btn wide" id="btn-spot-add">＋ 新增地點</button>
    <button class="btn wide" id="btn-spot-import" style="margin-top:8px;font-size:13px">⭳ 匯入 CSV</button>
  </div>

  <div class="section">
    <div class="label">篩選 / 排序</div>
    <div class="sf-types" id="sf-types">
      <button class="chip active" data-type="flower">花</button>
      <button class="chip active" data-type="mushroom">菇</button>
      <button class="chip active" data-type="hidden">隱藏</button>
    </div>
    <div class="row" style="margin-top:10px">
      <span style="font-size:12px;color:var(--muted)">分數 ≥</span>
      <input type="range" id="sf-score" min="0" max="10" step="0.5" value="0" aria-label="最低分數">
      <span class="readout" id="sf-score-val">0</span>
    </div>
    <div class="row" style="margin-top:10px">
      <select id="sf-sort" style="flex:1">
        <option value="score">分數</option>
        <option value="lng">經度</option>
        <option value="tz">時區</option>
      </select>
      <button class="btn" id="sf-dir" aria-label="正逆序" style="padding:9px 12px">↓</button>
    </div>
  </div>

  <div class="section" style="flex:1;min-height:0;display:flex;flex-direction:column">
    <div class="label">地點 <span id="spot-count" style="color:var(--faint)"></span></div>
    <div id="spot-list"></div>
  </div>

  <div class="section" id="spot-form" style="display:none">
    <div class="label" id="spot-form-title">新增地點</div>
    <div class="form-grid">
      <input id="spot-name" placeholder="名稱" style="grid-column:1 / -1">
      <input id="spot-lat" placeholder="緯度 lat" inputmode="decimal">
      <input id="spot-lng" placeholder="經度 lng" inputmode="decimal">
      <button class="btn" id="btn-spot-pick" style="grid-column:1 / -1;font-size:12px">⊕ 從地圖點選座標</button>
      <div class="row" style="grid-column:1 / -1">
        <span style="font-size:12px;color:var(--muted)">分數</span>
        <input type="range" id="spot-score" min="0" max="10" step="0.5" value="8">
        <span class="readout" id="spot-score-val">8</span>
      </div>
      <select id="spot-type" style="grid-column:1 / -1">
        <option value="flower">花</option>
        <option value="mushroom">菇</option>
        <option value="hidden">隱藏</option>
      </select>
      <button class="btn go" id="btn-spot-save">儲存</button>
      <button class="btn" id="btn-spot-cancel">取消</button>
    </div>
  </div>
  </div><!-- /tab-spots -->

  <div id="tab-routes" style="display:none">
    <div class="section">
      <button class="btn wide" id="btn-route-from-wp">＋ 從目前航點儲存</button>
      <button class="btn wide" id="btn-route-new" style="margin-top:8px;font-size:13px">＋ 新路線</button>
    </div>
    <div class="section" style="flex:1">
      <div class="label">路線 <span id="route-count" style="color:var(--faint)"></span></div>
      <div id="route-list"></div>
    </div>
    <div class="section" id="route-form" style="display:none">
      <div class="label" id="route-form-title">新路線</div>
      <div class="form-grid">
        <input id="route-name" placeholder="路線名稱" style="grid-column:1 / -1">
        <div class="row" style="grid-column:1 / -1">
          <span style="font-size:12px;color:var(--muted)">速度</span>
          <input type="range" id="route-speed" min="1" max="500" step="1" value="60">
          <span class="readout" id="route-speed-val">60</span>
        </div>
        <label class="route-loop-row" style="grid-column:1 / -1">
          <input type="checkbox" id="route-loop"> 循環
        </label>
      </div>
      <div class="label" style="margin-top:12px">座標點 <span id="route-pt-count" style="color:var(--faint)"></span></div>
      <div id="route-points"></div>
      <div class="form-grid" style="margin-top:8px">
        <button class="btn" id="btn-route-addpt" style="font-size:12px">＋ 新增點</button>
        <button class="btn" id="btn-route-pickpt" style="font-size:12px">⊕ 從地圖點選</button>
        <button class="btn" id="btn-route-capture" style="grid-column:1 / -1;font-size:12px">⤓ 用目前地圖航點覆蓋</button>
        <button class="btn go" id="btn-route-save">儲存</button>
        <button class="btn" id="btn-route-cancel">取消</button>
      </div>
    </div>
  </div><!-- /tab-routes -->
</aside>

<button id="spots-expand" title="展開地點庫" aria-label="展開地點庫"><svg class="ic"><use href="#i-chev-l"/></svg></button>

<!-- 新增裝置 -->
<div id="add-device-overlay" class="overlay" style="display:none">
  <div class="modal">
    <div class="modal-head"><span>連接裝置</span><button id="btn-add-close" aria-label="關閉"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="modal-body">
      <label class="fld">平台
        <select id="platform">
          <option value="ios">iOS</option>
          <option value="android">Android</option>
        </select>
      </label>
      <div id="ios-devices">
        <div class="dev-head">
          <span style="font-size:12px;color:var(--muted)">可用裝置 <span id="dev-count" style="color:var(--faint)"></span></span>
          <button class="btn" id="btn-dev-refresh">↻ 重新整理</button>
        </div>
        <div id="dev-list"></div>
      </div>
      <div id="android-connect" style="display:none">
        <button class="btn wide go" id="btn-connect-android">連接 Android（adb）</button>
      </div>
    </div>
  </div>
</div>

<!-- 設定 -->
<div id="settings-overlay" class="overlay" style="display:none">
  <div class="modal">
    <div class="modal-head"><span>設定</span><button id="btn-settings-close" aria-label="關閉"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="modal-body">
      <label class="fld">預設速度 (km/h)<input type="number" id="set-speed" min="1" max="500"></label>
      <label class="fld">GPS 抖動量 (公尺)<input type="number" id="set-jitter" min="0" max="50" step="0.5"></label>
      <label class="fld">單位
        <select id="set-units">
          <option value="metric">公制（km/h、km）</option>
          <option value="imperial">英制（mph、mi）</option>
        </select>
      </label>
      <label class="chkline"><input type="checkbox" id="set-remember"> 記住上次的地圖視角／模式／裝置</label>
      <label class="chkline"><input type="checkbox" id="set-autotunnel"> 啟動時自動建立 iOS 通道（首次連線較快）</label>

      <div class="modal-section">授權</div>
      <div class="lic-grid">
        <span class="lk">狀態</span><span class="lv" id="lic-status">—</span>
        <span class="lk">到期</span><span class="lv" id="lic-expires">—</span>
        <span class="lk">備註</span><span class="lv" id="lic-note">—</span>
        <span class="lk">機器碼</span>
        <span class="lv lic-mid"><code id="lic-machine">—</code><button class="copy-mini" id="btn-lic-copy" title="複製機器碼"><svg class="ic" style="width:13px;height:13px"><use href="#i-copy"/></svg></button></span>
      </div>
      <button class="btn wide" id="btn-lic-replace" style="margin-top:8px">更換授權檔…</button>

      <div class="modal-section">資料</div>
      <button class="btn wide" id="btn-backup-export">⭱ 匯出備份（地點＋路線）</button>
      <button class="btn wide" id="btn-backup-import" style="margin-top:8px">⭳ 匯入備份</button>
    </div>
  </div>
</div>

<!-- 日誌 -->
<div id="log-panel" class="log-panel" style="display:none">
  <div class="log-head">
    <span>日誌</span>
    <div class="log-actions">
      <button id="btn-log-copy">複製</button>
      <button id="btn-log-clear">清除</button>
      <button id="btn-log-close" aria-label="關閉"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
  </div>
  <div id="log-body" class="log-body"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="./renderer.js"></script>
</body>
</html>
