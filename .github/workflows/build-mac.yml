name: Build macOS

# 觸發方式：
#   1) 在 GitHub 網頁 Actions 分頁手動按 "Run workflow"
#   2) 推一個 v 開頭的 tag（例如 git tag v0.1.0 && git push --tags）
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 用 --ignore-scripts 跳過所有套件的安裝腳本，避開專案 allow-scripts/
      # lavamoat 的 postinstall 在 CI 上失敗的問題（本專案無原生模組，安全）。
      - name: Install dependencies
        run: npm install --ignore-scripts

      # 因為上一步跳過了腳本，這裡單獨執行 electron 的安裝程式，
      # 確保 Electron 執行檔有下載下來（electron-builder 需要它）。
      # 加重試以容忍 GitHub 下載伺服器的暫時性逾時（504 等）。
      - name: Ensure Electron binary
        run: |
          for i in 1 2 3 4 5; do
            node node_modules/electron/install.js && break
            echo "Electron 下載失敗（第 $i 次），15 秒後重試…"
            sleep 15
          done
          test -d node_modules/electron/dist

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 用 PyInstaller 把 helper 與 tunneld 凍成自帶 Python+pymobiledevice3 的
      # Mac 原生執行檔，放到 helper-bin/，electron-builder 會打包進 resources/helper/。
      # 注意：runner 是 Apple Silicon，產出的是 arm64 二進位（見 main.ts 的架構判斷）。
      - name: Freeze Python helpers (self-contained)
        run: |
          python -m pip install --upgrade pip
          pip install pymobiledevice3 pyinstaller
          pyinstaller --onefile --noconfirm --collect-all pymobiledevice3 \
            --name ios-location-helper --distpath helper-bin \
            --workpath /tmp/pyi-h --specpath /tmp/pyi-h python/ios-location-helper.py
          pyinstaller --onefile --noconfirm --collect-all pymobiledevice3 \
            --name tunneld --distpath helper-bin \
            --workpath /tmp/pyi-t --specpath /tmp/pyi-t python/tunneld-launcher.py
          chmod +x helper-bin/ios-location-helper helper-bin/tunneld
          ls -la helper-bin

      # 直接呼叫 electron-builder 並明確 --publish never，
      # 避免它在 CI 偵測下自動嘗試發佈到 GitHub Releases（會要 token 而失敗）。
      - name: Build macOS app (unsigned, no publish)
        run: |
          npm run build
          npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error